name: hnet overlay image

on:
  push:
    branches:
      - "hnet/**"

permissions:
  contents: read
  packages: write

env:
  BASE: ghcr.io/blakeblackshear/frigate:cfa08c5-rpi@sha256:7f395bb1db0ff766b387f8c70f85f4d2b5da63ab588693fcda8cc19f5e916cea
  UPSTREAM_COMMIT: cfa08c56b

jobs:
  overlay:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base image files must match the upstream commit
        run: |
          for f in frigate/config/camera/ffmpeg.py frigate/video/ffmpeg.py; do
            docker run --rm --entrypoint cat "$BASE" "/opt/frigate/$f" > /tmp/base.py
            git show "$UPSTREAM_COMMIT:$f" > /tmp/upstream.py
            cmp /tmp/base.py /tmp/upstream.py
          done
      - name: Only the two overlaid Python files may differ in frigate/
        run: |
          changed=$(git diff --name-only "$UPSTREAM_COMMIT" HEAD -- frigate | sort | tr '\n' ' ')
          test "$changed" = "frigate/config/camera/ffmpeg.py frigate/video/ffmpeg.py "
      - name: Build
        run: |
          sha=${GITHUB_SHA::7}
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${sha}-rpi" >> "$GITHUB_ENV"
          docker build -f docker/hnet/Dockerfile --build-arg HNET_SHA="$sha" -t "ghcr.io/${GITHUB_REPOSITORY,,}:${sha}-rpi" .
      - name: Patched field loads and defaults to 20
        run: |
          docker run --rm --entrypoint python3 -w /opt/frigate "$IMAGE" -c "
          from frigate.config.camera.ffmpeg import FfmpegConfig
          assert FfmpegConfig().no_frames_threshold == 20.0
          assert FfmpegConfig(no_frames_threshold=60).no_frames_threshold == 60.0
          from frigate.version import VERSION; print(VERSION)"
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
